[project]
name = "tas-copilot-contracts"
version = "0.1.0"
description = "Typed shared contracts for the TASCopilot."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2,<3", "eval-type-backport>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
