[project]
name = "tas-copilot-core"
version = "0.1.0"
description = "Core registry, retrieval, ontology, and workflow spine for the TASCopilot."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2,<3",
  "eval-type-backport>=0.2",
  "pyyaml>=6",
  "tas-copilot-contracts",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
mcp = ["mcp>=1.2"]
dashboard = [
  "dash>=2.17",
  "plotly>=5",
]
materials = [
  "pymatgen>=2024",
  "periodictable>=2.0",
  "ase>=3.22",
]
chemtext = [
  "chemdataextractor>=2; python_version < '3.12'",
]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
tas-copilot = "tas_copilot_core.cli:main"

[project.entry-points."tas_copilot.tools"]
tas_copilot_composites = "tas_copilot_core.composite_tools"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
