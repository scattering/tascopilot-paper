# Curated instrument and facility aliases: the surface forms papers use for
# the same apparatus, so "BT-7", "BT7", "the BT-7 thermal triple-axis
# spectrometer" and "BT-7 at the NCNR" resolve to one canonical id. Hand
# maintained; never generated by a model. Matching is tolerant of spacing,
# hyphens and case, and ignores the generic words listed under
# `ignore_words`, but a surface form must match as a whole token sequence.
version: 1
ignore_words: [the, a, an, at, of, spectrometer, spectrometers, instrument, beamline, beam, line, diffractometer, thermal, cold, "triple-axis", "triple axis", "tripleaxis", neutron, powder, "time-of-flight", "time of flight", chopper, "direct-geometry", "direct geometry"]
facilities:
