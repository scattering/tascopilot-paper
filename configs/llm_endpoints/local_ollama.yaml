endpoint_id: local_ollama
site: local workstation
description: >-
  Local Ollama for development and smoke tests with approved local models
  (Gemma/Nemotron-style).
provider: ollama
base_url_env: OLLAMA_URL
base_url_default: http://127.0.0.1:11434
model_env: OLLAMA_MODEL
model_default: gemma3:4b
api_key_env: null
notes:
  - Development convenience only; results are not evaluation evidence.
