  - local_concept_id: spinwave_dispersion
    retrieval_policy: no_expansion
    notes: "MagMO has no magnon or dispersion class. The measured magnon stiffness D (meV A^2) is the neutron-side input to MagMO's exchange stiffness through D = 2 A g mu_B / M_s; recorded as relatedMatch so a neutron result can be found from the micromagnetic side, never as a synonym."
    mappings:
      - {vocabulary_id: magmo, mapping_type: relatedMatch, external_label: "ExchangeStiffnessConstant", external_iri: "https://w3id.org/emmo/domain/magnetic-materials#EMMO_526ed2a5-a017-590e-8eb8-8a900f2b3b78", mapping_status: proposed, confidence: 0.6, retrieval_policy: validation_only, evidence: ["MagMO 0.0.5 class ExchangeStiffnessConstant"], notes: "D = 2 A g mu_B / M_s for a ferromagnet; units meV A^2 (D) vs J/m (A). Conversion needs M_s and g; not an identity."}
      - {vocabulary_id: magmo, mapping_type: relatedMatch, external_label: "SpontaneousMagnetization", external_iri: "https://w3id.org/emmo/domain/magnetic-materials#EMMO_032731f8-874d-5efb-9c9d-6dafaa17ef25", mapping_status: proposed, confidence: 0.4, retrieval_policy: validation_only, evidence: ["MagMO 0.0.5 class SpontaneousMagnetization"], notes: "Enters the D-to-A conversion; not a property of the dispersion itself."}
  - local_concept_id: spin_gap
    retrieval_policy: no_expansion
    notes: "A spin gap is a single-ion or exchange anisotropy D (meV) in a spin Hamiltonian; MagMO's anisotropy constants are energy densities K (J/m^3) and the anisotropy field H_K. They agree only through a model (e.g. K_u = n S^2 D / V for single-ion uniaxial), so relatedMatch."
    mappings:
      - {vocabulary_id: magmo, mapping_type: relatedMatch, external_label: "UniaxialAnisotropyConstant", external_iri: "https://w3id.org/emmo/domain/magnetic-materials#EMMO_49a882d1-9ce7-522b-91e7-3a460f25f5ac", mapping_status: proposed, confidence: 0.5, retrieval_policy: validation_only, evidence: ["MagMO 0.0.5 class UniaxialAnisotropyConstant"], notes: "Energy density K_u (J/m^3) vs Hamiltonian D (meV); convention conversion required."}
      - {vocabulary_id: magmo, mapping_type: relatedMatch, external_label: "AnisotropyField", external_iri: "https://w3id.org/emmo/domain/magnetic-materials#EMMO_cd58ebab-4351-5d0d-ad45-bbddd6efead3", mapping_status: proposed, confidence: 0.4, retrieval_policy: validation_only, evidence: ["MagMO 0.0.5 class AnisotropyField"], notes: "H_K = 2 K_u / (mu_0 M_s); a gap can be expressed as g mu_B H_K only in a mean-field picture."}
  - local_concept_id: magnetic_order_parameter
    retrieval_policy: no_expansion
    notes: "No MagMO target. MagMO 0.0.5 has no Curie or Neel temperature class and no order-parameter concept (the paper mentions Curie temperature; the released file does not carry it). Recorded so nobody keeps looking; revisit at the next MagMO version."
    mappings: []
  - local_concept_id: magnetic_bragg_peak
    retrieval_policy: no_expansion
    notes: "No MagMO target: MagMO has no scattering concepts. Ordered moment per ion, propagation vector and spin direction likewise stay local (magCIF for structure)."
    mappings: []
