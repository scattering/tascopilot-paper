tools:
  - name: extract_document
    namespace: tas.corpus
    version: "0.1.0"
    description: Extract capped, provenance-tagged text and chunk candidates from local-private corpus documents.
    input_schema: {type: object, required: [path], properties: {path: {type: string}, backend: {type: string}, max_pages: {type: integer}, max_chars: {type: integer}, output_dir: {type: string}}}
    output_schema: {type: object}
    side_effect_level: local_files
    availability: unavailable
    implementation_type: manifest_only
    required_dependencies: ["pdftotext baseline or optional structured extractor plugin such as GROBID/Docling"]
    preconditions: ["Document path is local.", "Private source text is treated as untrusted data.", "Artifacts, if requested, are written only under an explicit output directory."]
    postconditions: ["Extractor status, quality metrics, warnings, provenance, and optional local artifacts are returned."]
    provenance_policy: "Record document path/hash when available, extractor backend, parser version, page/character caps, and artifact paths."
    permissions_required: [writes_local_files]
    enabled_by_default: true
  - name: parse_formula
    namespace: tas.material_identity
    version: "0.1.0"
    description: Parse standard chemical formulas through an optional external material-identity parser such as pymatgen.
    input_schema: {type: object, required: [text], properties: {text: {type: string}, family: {type: string}}}
    output_schema: {type: object}
    side_effect_level: none
    availability: unavailable
    implementation_type: stub
    required_dependencies: ["tas-material-identity plugin or optional pymatgen backend"]
    preconditions: ["Formula text is supplied."]
    postconditions: ["Normalized material identity is returned, or unavailable if parser backend is absent."]
    provenance_policy: "Record source text, parser backend, parser version, and interpretation method."
    permissions_required: [read_only]
    enabled_by_default: true
  - name: parse_filename_composition
    namespace: tas.material_identity
    version: "0.1.0"
    description: Interpret TAS filename/sample-log composition shorthands using curated family grammars.
    input_schema: {type: object, required: [text], properties: {text: {type: string}, family: {type: string}}}
    output_schema: {type: object}
    side_effect_level: none
    availability: unavailable
    implementation_type: manifest_only
    required_dependencies: ["core curated family grammar; optional external validation parser"]
    preconditions: ["A curated material family grammar exists."]
    postconditions: ["Filename-derived material identity evidence is returned with ambiguity warnings where needed."]
    provenance_policy: "Record source text and grammar version/path."
    permissions_required: [read_only]
    enabled_by_default: true
  - name: classify_source_family
    namespace: tas.psd
    version: "0.1.0"
    description: Classify TAS records as PSD temperature maps, PSD angle temperature series, elastic/inelastic line scans, or sparse unknown records.
    input_schema: {type: object}
    output_schema: {type: object}
    side_effect_level: none
    availability: unavailable
    implementation_type: manifest_only
    required_dependencies: ["core deterministic classifier or external PSD grouping plugin"]
    preconditions: ["Metadata record includes detector mode, scan type, energy, temperature, or PSD channel evidence."]
    postconditions: ["Source family classification with evidence and missing fields is returned."]
    provenance_policy: "Record source record id and metadata fields used."
    permissions_required: [read_only]
    enabled_by_default: true
  - name: read_bt7_data
    namespace: tas.data_reader
    version: "0.1.0"
    description: Read BT-7 data files or runs through an external adapter.
    input_schema: {type: object}
    output_schema: {type: object}
    side_effect_level: none
    availability: unavailable
    implementation_type: stub
    required_dependencies: []
    preconditions: ["External data-reader repository configured."]
    postconditions: ["Parsed metadata and data references preserve provenance."]
    provenance_policy: "Record input file path/checksum and adapter version."
    permissions_required: [read_only]
    enabled_by_default: true
