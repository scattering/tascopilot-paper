<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 680 500" role="img" font-family="Helvetica, Arial, sans-serif">
<title>tascopilot architecture</title>
<desc>Published literature and raw instrument data are brought into a single provenance-tracked graph. An agentic retrieval loop reads parsed chunks and writes typed facts, each carrying an exact quote from a specific page. Experiments and their scans enter the same graph. A curated ontology supplies the vocabulary that makes facts from different papers comparable. Graph retrieval traverses the result to answer questions with provenance, plan experiments, and drive reduction and fitting. Edges the system derives mechanically are drawn solid; edges a model asserts are drawn dashed and are reviewed before use.</desc>
<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
<defs>
<marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b6b6b"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0641e"/></marker>
</defs>

<text x="0" y="18" font-size="13" fill="#1a1a1a">Published literature and raw instrument data in one provenance-tracked graph</text>

<text x="175" y="48" font-size="11" fill="#6b6b6b">what has been written</text>
<rect x="175" y="56" width="105" height="38" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="185" y="80" font-size="12" fill="#1a1a1a">papers</text>
<line x1="280" y1="75" x2="292" y2="75" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="296" y="56" width="114" height="38" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="306" y="80" font-size="12" fill="#1a1a1a">parsed chunks</text>

<text x="445" y="48" font-size="11" fill="#6b6b6b">what was measured</text>
<rect x="445" y="56" width="105" height="38" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="455" y="80" font-size="12" fill="#1a1a1a">experiments</text>
<line x1="550" y1="75" x2="562" y2="75" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="566" y="56" width="114" height="38" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="576" y="80" font-size="12" fill="#1a1a1a">raw scans</text>

<rect x="0" y="126" width="150" height="290" rx="4" fill="#faf8f5" stroke="#b0641e"/>
<text x="12" y="148" font-size="12" fill="#1a1a1a">ontology</text>
<text x="12" y="170" font-size="11" fill="#6b6b6b">a controlled vocabulary</text>
<text x="12" y="188" font-size="11" fill="#6b6b6b">so a fact from one paper</text>
<text x="12" y="206" font-size="11" fill="#6b6b6b">is comparable with a fact</text>
<text x="12" y="224" font-size="11" fill="#6b6b6b">from another</text>
<text x="12" y="256" font-size="11" fill="#1a1a1a">130 concepts, e.g.</text>
<text x="12" y="278" font-size="11" fill="#4a4a4a">constant_q_scan</text>
<text x="12" y="296" font-size="11" fill="#4a4a4a">magnetic_structure</text>
<text x="12" y="314" font-size="11" fill="#4a4a4a">pg002_mono</text>
<text x="12" y="332" font-size="11" fill="#4a4a4a">spurion_check</text>
<text x="12" y="366" font-size="11" fill="#b0641e">used to narrow a search,</text>
<text x="12" y="384" font-size="11" fill="#b0641e">not to broaden it</text>

<line x1="150" y1="160" x2="171" y2="160" stroke="#b0641e" stroke-width="1.5" marker-end="url(#k)"/>
<line x1="150" y1="270" x2="171" y2="270" stroke="#b0641e" stroke-width="1.5" marker-end="url(#k)"/>
<line x1="150" y1="390" x2="171" y2="390" stroke="#b0641e" stroke-width="1.5" marker-end="url(#k)"/>

<line x1="353" y1="94" x2="353" y2="122" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="175" y="126" width="235" height="64" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="187" y="148" font-size="12" fill="#1a1a1a">agentic RAG</text>
<text x="187" y="168" font-size="11" fill="#6b6b6b">extracts facts, then asks itself</text>
<text x="187" y="184" font-size="11" fill="#6b6b6b">what is still missing and re-reads</text>
<line x1="292" y1="190" x2="292" y2="217" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>

<line x1="623" y1="94" x2="623" y2="217" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>

<rect x="175" y="221" width="505" height="132" rx="4" fill="#f5f3f0" stroke="#d9d5d0"/>
<text x="187" y="241" font-size="12" fill="#1a1a1a">evidence graph</text>

<rect x="195" y="252" width="85" height="28" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="205" y="270" font-size="11" fill="#1a1a1a">Paper</text>
<line x1="280" y1="266" x2="296" y2="266" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="300" y="252" width="100" height="28" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="310" y="270" font-size="11" fill="#1a1a1a">quoted chunk</text>
<line x1="400" y1="266" x2="416" y2="266" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="420" y="252" width="85" height="28" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="430" y="270" font-size="11" fill="#1a1a1a">Fact</text>
<line x1="505" y1="266" x2="541" y2="266" stroke="#b0641e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#k)"/>
<rect x="545" y="252" width="115" height="28" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="555" y="270" font-size="11" fill="#1a1a1a">Experiment</text>
<line x1="602" y1="280" x2="602" y2="306" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="545" y="310" width="115" height="28" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="555" y="328" font-size="11" fill="#1a1a1a">Scan</text>
<text x="195" y="302" font-size="11" fill="#6b6b6b">every fact traces back to an exact quote, on a page, in a paper</text>
<text x="195" y="324" font-size="11" fill="#b0641e">a paper is linked to the data that measured it</text>

<line x1="292" y1="353" x2="292" y2="378" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>
<rect x="175" y="382" width="235" height="64" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="187" y="404" font-size="12" fill="#1a1a1a">graph RAG</text>
<text x="187" y="424" font-size="11" fill="#6b6b6b">answers by walking the graph,</text>
<text x="187" y="440" font-size="11" fill="#6b6b6b">so every answer cites its source</text>
<line x1="410" y1="414" x2="441" y2="414" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#n)"/>

<rect x="445" y="382" width="235" height="64" rx="4" fill="#ffffff" stroke="#b8b2ab"/>
<text x="457" y="404" font-size="11" fill="#1a1a1a">answers with provenance</text>
<text x="457" y="424" font-size="11" fill="#1a1a1a">experiment planning</text>
<text x="457" y="440" font-size="11" fill="#1a1a1a">reduction and fitting</text>

<line x1="0" y1="474" x2="26" y2="474" stroke="#6b6b6b" stroke-width="1.5"/>
<text x="34" y="478" font-size="11" fill="#4a4a4a">derived by the system</text>
<line x1="230" y1="474" x2="256" y2="474" stroke="#b0641e" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="264" y="478" font-size="11" fill="#b0641e">asserted by a model — reviewed before use</text>
</svg>
